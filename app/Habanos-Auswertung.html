<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habanos-Auswertung</title>
<style>
  :root {
    --bg: #f6f3ee; --panel: #fffdf9; --line: #e4ddd2; --text: #2b241d; --muted: #7a6f63;
    --accent: #8a4b1f; --accent-soft: #f1e3d6; --ok: #2f7d4a; --ok-soft: #e1f1e6;
    --bad: #b23a2e; --bad-soft: #f8e1de; --star: #c9971c;
    --heat0: #f1ebe2; --heat: 138, 75, 31;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1714; --panel: #23201c; --line: #3a342d; --text: #ede6dc; --muted: #a39686;
      --accent: #e0a36f; --accent-soft: #3b2b1e; --ok: #6cc28a; --ok-soft: #1f3326;
      --bad: #ef8a7e; --bad-soft: #3d2320; --star: #f0c450; --heat0: #2a2621; --heat: 224, 163, 111;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; display: flex;
           flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .2px; }
  .stand { color: var(--muted); font-size: 13px; }
  button { font: inherit; cursor: pointer; }
  .reload { border: 1px solid var(--line); background: var(--panel); color: var(--text);
            border-radius: 8px; padding: 4px 10px; margin-left: 8px; }
  nav { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px;
        overflow-x: auto; border-bottom: 1px solid var(--line); }
  nav button { border: 0; background: none; color: var(--muted); padding: 10px 12px;
               border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button.on { color: var(--text); border-color: var(--accent); font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 24px; }
  .kpi span { color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 16px; }
  .card h2 small { color: var(--muted); font-weight: 400; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  input[type=search], select { font: inherit; padding: 6px 10px; border-radius: 8px;
         border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  input[type=search] { flex: 1 1 220px; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .star { color: var(--star); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.new { background: var(--accent-soft); color: var(--accent); }
  .muted { color: var(--muted); }
  .heat { display: grid; grid-template-columns: 34px repeat(24, minmax(16px, 1fr)); gap: 2px; font-size: 11px; }
  .heat div { aspect-ratio: 1; border-radius: 3px; display: flex; align-items: center; justify-content: center; }
  .heat .lab { aspect-ratio: auto; color: var(--muted); justify-content: flex-start; }
  .heat .cell { background: var(--heat0); color: transparent; }
  .heat .cell:hover { outline: 1px solid var(--text); color: var(--text); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .bar { height: 8px; border-radius: 4px; background: var(--accent); }
  .wish { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .wish:last-child { border: 0; }
  .wish ul { margin: 4px 0 0; padding-left: 18px; }
  .err { background: var(--bad-soft); color: var(--bad); padding: 12px; border-radius: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Habanos-Auswertung</h1>
  <div class="stand"><span id="stand">lädt …</span><button class="reload" id="reload">Neu laden</button></div>
</header>
<nav id="tabs">
  <button data-tab="bestand" class="on">Jetzt lieferbar</button>
  <button data-tab="wunsch">Wunschliste</button>
  <button data-tab="muster">Wann kommt Ware?</button>
  <button data-tab="haltbar">Wie schnell weg?</button>
  <button data-tab="verlauf">Verlauf</button>
  <button data-tab="neuheiten">Neuheiten</button>
  <button data-tab="shops">Shops</button>
</nav>
<main id="main"><p class="muted">Daten werden von GitHub geladen …</p></main>

<script>
// Liest die Daten direkt aus dem öffentlichen Repo – immer der Stand des letzten Bot-Laufs.
const REPO = "linusmw/habanos-waechter";
const RAW = `https://raw.githubusercontent.com/${REPO}/main/`;
const ARRIVALS = new Set(["wieder_da", "neu", "neu_oder_wieder"]);
const KIND = { wieder_da: ["wieder da", "ok"], neu: ["neu", "new"], neu_oder_wieder: ["neu/wieder da", "ok"],
               neu_nicht_lieferbar: ["neu, nicht lieferbar", "new"], ausverkauft: ["ausverkauft", "bad"] };
const DAYS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const NAMES = { zigarrentraum: "Zigarrentraum", casabenden: "Casa Benden", brinkmann: "Brinkmann Finest",
  noblego: "Noblego", zigarrede: "zigarre.de", wolsdorff: "Wolsdorff", tabacstore: "Tabacstore",
  dalay: "Dalay Zigarren", peterheinrichs: "Peter Heinrichs", falkum: "Tabakhaus Falkum", ccigars: "c-cigars",
  habanoszigarren: "habanos-zigarren.com", lagalana: "La Galana", dominique: "Dominique London",
  starkezigarren: "StarkeZigarren", pipehouse: "Pipe House", nobbis: "Nobbis Tabakwelt", paulbugge: "Paul Bugge",
  cigarrenversand24: "Cigarrenversand24", tabakkontor: "Tabak-Kontor Leipzig", herzog: "Zigarren Herzog" };

let D = null;            // geladene Daten
let tab = "bestand";
const ui = {};           // Filterzustand je Reiter
try { tab = localStorage.getItem("habanos-tab") || tab; } catch (e) {}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shopName = id => NAMES[id] || id;
const fmtTime = iso => iso ? new Date(iso).toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "–";
const ago = iso => {
  if (!iso) return "";
  const h = (Date.now() - new Date(iso)) / 36e5;
  return h < 1 ? `${Math.max(1, Math.round(h * 60))} Min.` : h < 48 ? `${Math.round(h)} Std.` : `${Math.round(h / 24)} Tagen`;
};
const fmtHours = h => h == null || isNaN(h) ? "–" : h < 1 ? `${Math.round(h * 60)} Min.` : h < 48 ? `${h.toFixed(1).replace(".", ",")} Std.` : `${(h / 24).toFixed(1).replace(".", ",")} Tage`;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

function parseCsv(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter(Boolean);
  const head = lines.shift().split(";");
  return lines.map(l => { const v = l.split(";"), o = {}; head.forEach((h, i) => o[h] = v[i] ?? ""); return o; });
}

// ---- Wunschliste: gleiche Regeln wie wish_for() in waechter.py ----
const normalize = s => (s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/[^a-z0-9]+/g, " ").trim().split(/\s+/).filter(Boolean).join(" ");
const wishWords = s => normalize(String(s).replace(/º/g, "o").replace(/\b\d+\s*(['’´]\s*s|er)\b/gi, " "))
  .split(" ").filter(Boolean).map(w => ["n", "nr", "nro", "num"].includes(w) ? "no" : w);
const has = (w, words) => /^[a-z]{3,}$/.test(w) ? words.some(x => x.startsWith(w)) : words.includes(w);
function wishFor(name, pack, wishes) {
  const words = wishWords(`${name} ${pack || ""}`);
  for (const label of wishes) {
    const t = label.split(/\s+/);
    const need = wishWords(t.filter(x => !x.startsWith("-")).join(" "));
    const avoid = wishWords(t.filter(x => x.startsWith("-")).map(x => x.slice(1)).join(" "));
    if (need.length && need.every(w => has(w, words)) && !avoid.some(w => has(w, words))) return label;
  }
  return null;
}

async function load() {
  document.getElementById("stand").textContent = "lädt …";
  const bust = `?t=${Date.now()}`;
  const get = (f, json) => fetch(RAW + f + bust, { cache: "no-store" }).then(r => {
    if (!r.ok) throw new Error(`${f}: HTTP ${r.status}`); return json ? r.json() : r.text(); });
  try {
    const [state, verlauf, historie, neuheiten, wunsch] = await Promise.all([
      get("state.json", true), get("verlauf.csv"), get("historie.csv"), get("neuheiten.csv").catch(() => ""), get("wunschliste.txt")]);
    const commit = await fetch(`https://api.github.com/repos/${REPO}/commits?per_page=1&path=state.json`)
      .then(r => r.ok ? r.json() : []).catch(() => []);
    const wishes = wunsch.split("\n").map(l => l.split("#")[0].trim()).filter(Boolean);
    const items = [];
    for (const [shop, st] of Object.entries(state.shops || {})) {
      if (!NAMES[shop]) continue;   // z. B. abgeschaltete Shops
      for (const [key, it] of Object.entries(st.items || {}))
        items.push({ shop, key, ...it, wish: wishFor(it.name, it.pack, wishes) });
    }
    D = { state, items, wishes, verlauf: parseCsv(verlauf), historie: parseCsv(historie),
          neuheiten: neuheiten ? parseCsv(neuheiten) : [], stand: commit[0]?.commit?.committer?.date };
    document.getElementById("stand").textContent = D.stand ? `Stand: ${fmtTime(D.stand)} (vor ${ago(D.stand)})` : "Stand: unbekannt";
    render();
  } catch (e) {
    document.getElementById("stand").textContent = "Laden fehlgeschlagen";
    document.getElementById("main").innerHTML = `<div class="err">Die Daten konnten nicht von GitHub geladen werden (${esc(e.message)}). Internetverbindung prüfen und „Neu laden“ drücken.</div>`;
  }
}

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (!D) return;
  const main = document.getElementById("main");
  main.innerHTML = ({ bestand, wunsch, muster, haltbar, verlauf, neuheiten, shops })[tab]();
  main.querySelectorAll("[data-ui]").forEach(el => {
    const k = el.dataset.ui;
    if (ui[k] !== undefined) el.type === "checkbox" ? el.checked = ui[k] : el.value = ui[k];
    el.addEventListener(el.type === "search" ? "input" : "change", () => {
      ui[k] = el.type === "checkbox" ? el.checked : el.value;
      const pos = el.selectionStart; render();
      const again = document.querySelector(`[data-ui="${k}"]`);
      if (again && el.type === "search") { again.focus(); again.setSelectionRange(pos, pos); }
    });
  });
}

const shopSelect = (k, ids, all = "Alle Shops") =>
  `<select data-ui="${k}"><option value="">${all}</option>${ids.map(id => `<option value="${esc(id)}">${esc(shopName(id))}</option>`).join("")}</select>`;
const byShopName = names => [...new Set(names)].sort((a, b) => a.localeCompare(b, "de"));

// ---- Reiter ----
function bestand() {
  const q = normalize(ui.q || ""), onlyWish = ui.onlyWish, shop = ui.bshop || "";
  const avail = D.items.filter(i => i.available && D.state.shops[i.shop]?.items && (i.shop !== "dominique"));
  let rows = avail.filter(i => (!shop || i.shop === shop) && (!onlyWish || i.wish) && (!q || normalize(`${i.name} ${i.pack}`).includes(q)));
  rows.sort((a, b) => (b.wish ? 1 : 0) - (a.wish ? 1 : 0) || String(b.available_since || "").localeCompare(String(a.available_since || "")) || a.name.localeCompare(b.name, "de"));
  const recent = avail.filter(i => i.available_since && Date.now() - new Date(i.available_since) < 864e5).length;
  const shopsWith = new Set(avail.map(i => i.shop)).size;
  return `
  <div class="kpis">
    <div class="kpi"><b>${avail.length}</b><span>Artikel lieferbar</span></div>
    <div class="kpi"><b class="star">${avail.filter(i => i.wish).length}</b><span>davon von der Wunschliste</span></div>
    <div class="kpi"><b>${recent}</b><span>seit den letzten 24 Std. da</span></div>
    <div class="kpi"><b>${shopsWith}</b><span>Shops mit Ware</span></div>
  </div>
  <div class="card">
    <div class="tools">
      <input type="search" data-ui="q" placeholder="Suchen, z. B. Cohiba Siglo">
      ${shopSelect("bshop", byShopName(avail.map(i => i.shop)))}
      <label class="chk"><input type="checkbox" data-ui="onlyWish"> nur Wunschliste</label>
    </div>
    <div class="scroll"><table>
      <tr><th>Zigarre</th><th>Packung</th><th class="num">Preis</th><th>Shop</th><th class="num">da seit</th></tr>
      ${rows.map(i => `<tr>
        <td>${i.wish ? '<span class="star" title="Wunschliste: ' + esc(i.wish) + '">★</span> ' : ""}<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.name)}</a></td>
        <td>${esc(i.pack)}</td><td class="num">${esc(i.price)}</td><td>${esc(shopName(i.shop))}</td>
        <td class="num muted" title="${esc(fmtTime(i.available_since))}">${i.available_since ? ago(i.available_since) : "länger"}</td></tr>`).join("")
        || '<tr><td colspan="5" class="muted">Nichts gefunden.</td></tr>'}
    </table></div>
    <p class="muted" style="margin:10px 0 0;font-size:13px">Dominique London zeigt keinen Lagerstand und fehlt hier. „länger“ = schon beim Start der Überwachung lieferbar.</p>
  </div>`;
}

function wunsch() {
  const q = normalize(ui.wq || "");
  const blocks = D.wishes.filter(w => !q || normalize(w).includes(q)).map(w => {
    const hits = D.items.filter(i => i.wish === w && i.shop !== "dominique");
    const av = hits.filter(i => i.available);
    const lastSeen = hits.map(i => i.last_available).filter(Boolean).sort().pop();
    return { w, hits, av, lastSeen };
  });
  blocks.sort((a, b) => b.av.length - a.av.length || String(b.lastSeen || "").localeCompare(String(a.lastSeen || "")));
  const n = blocks.filter(b => b.av.length).length;
  return `
  <div class="kpis">
    <div class="kpi"><b>${D.wishes.length}</b><span>Wünsche</span></div>
    <div class="kpi"><b class="star">${n}</b><span>gerade irgendwo lieferbar</span></div>
    <div class="kpi"><b>${blocks.filter(b => !b.hits.length).length}</b><span>in keinem Shop gelistet</span></div>
  </div>
  <div class="card">
    <div class="tools"><input type="search" data-ui="wq" placeholder="Wunsch suchen"></div>
    ${blocks.map(b => `<div class="wish">
      <b>${b.av.length ? '<span class="star">★</span> ' : ""}${esc(b.w)}</b>
      ${b.av.length ? `<span class="pill ok">${b.av.length}× lieferbar</span>` : b.hits.length
        ? `<span class="muted"> – ausverkauft${b.lastSeen ? ", zuletzt lieferbar vor " + ago(b.lastSeen) : ""} (${b.hits.length} Einträge in ${new Set(b.hits.map(h => h.shop)).size} Shops)</span>`
        : '<span class="muted"> – in keinem überwachten Shop gelistet</span>'}
      ${b.av.length ? `<ul>${b.av.map(i => `<li><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.name)}</a> ${esc(i.pack)} · ${esc(i.price)} · ${esc(shopName(i.shop))}</li>`).join("")}</ul>` : ""}
    </div>`).join("")}
  </div>`;
}

// Funde = Läufe, in denen ein Shop Ware bekommen hat (mehrere Zigarren auf einmal zählen als ein Fund).
function funde() {
  const seen = new Set(), out = [];
  for (const r of D.verlauf) {
    if (!ARRIVALS.has(r.ereignis)) continue;
    const k = r.shop + "|" + r.zeit_utc;
    if (seen.has(k)) continue;
    seen.add(k); out.push({ shop: r.shop, tag: r.wochentag, stunde: +r.stunde, zeit: r.zeit_utc, hist: false });
  }
  for (const r of D.historie) out.push({ shop: r.shop, tag: r.wochentag, stunde: +r.stunde, zeit: r.zeit_utc, hist: true });
  return out;
}

function heatmap(rows) {
  const m = DAYS.map(() => Array(24).fill(0));
  rows.forEach(r => { const d = DAYS.indexOf(r.tag); if (d >= 0 && r.stunde >= 0 && r.stunde < 24) m[d][r.stunde]++; });
  const max = Math.max(1, ...m.flat());
  let h = '<div class="heat"><div class="lab"></div>' + Array.from({ length: 24 }, (_, i) => `<div class="lab" style="justify-content:center">${i % 3 ? "" : i}</div>`).join("");
  m.forEach((row, d) => {
    h += `<div class="lab">${DAYS[d]}</div>` + row.map((v, s) =>
      `<div class="cell" title="${DAYS[d]} ${s}–${s + 1} Uhr: ${v}" style="${v ? `background:rgba(var(--heat),${(0.15 + 0.85 * v / max).toFixed(2)});color:${v / max > .55 ? "#fff" : "inherit"}` : ""}">${v || ""}</div>`).join("");
  });
  const dayTot = m.map(r => r.reduce((a, b) => a + b, 0));
  const best = dayTot.map((v, i) => [v, DAYS[i]]).sort((a, b) => b[0] - a[0]).slice(0, 2).filter(x => x[0]);
  const hourTot = Array.from({ length: 24 }, (_, s) => m.reduce((a, r) => a + r[s], 0));
  const bh = hourTot.map((v, s) => [v, s]).sort((a, b) => b[0] - a[0]).slice(0, 3).filter(x => x[0]).map(x => `${x[1]} Uhr`);
  return h + `</div><p class="muted" style="margin:10px 0 0;font-size:13px">${rows.length} Funde · stärkste Tage: ${best.map(b => `${b[1]} (${b[0]})`).join(", ") || "–"} · stärkste Stunden: ${bh.join(", ") || "–"} (deutsche Zeit)</p>`;
}

function muster() {
  const all = funde().filter(f => !ui.nohist || !f.hist);
  const shop = ui.mshop || "";
  const rows = shop ? all.filter(f => f.shop === shop) : all;
  const per = {};
  all.forEach(f => (per[f.shop] ||= []).push(f));
  const last = D.verlauf.filter(r => ARRIVALS.has(r.ereignis)).slice(-400).reverse();
  const lastRuns = []; const seen = new Set();
  for (const r of last) { const k = r.shop + r.zeit_utc; if (seen.has(k)) continue; seen.add(k);
    lastRuns.push({ ...r, n: last.filter(x => x.shop === r.shop && x.zeit_utc === r.zeit_utc).length }); if (lastRuns.length >= 15) break; }
  return `
  <div class="card">
    <h2>Wann bekommen die Shops Ware? <small>Wochentag × Uhrzeit</small></h2>
    <div class="tools">${shopSelect("mshop", byShopName(Object.keys(per)).sort((a, b) => per[b].length - per[a].length))}
      <label class="chk"><input type="checkbox" data-ui="nohist"> nur selbst beobachtete (ohne historische Funde)</label></div>
    ${heatmap(rows)}
  </div>
  <div class="grid2">
    <div class="card"><h2>Funde je Shop</h2><table>
      ${Object.entries(per).sort((a, b) => b[1].length - a[1].length).map(([s, f]) => {
        const max = Math.max(...Object.values(per).map(x => x.length));
        return `<tr><td>${esc(s)}</td><td style="width:45%"><div class="bar" style="width:${(100 * f.length / max).toFixed(0)}%"></div></td><td class="num">${f.length}</td></tr>`; }).join("")}
    </table></div>
    <div class="card"><h2>Letzte Wareneingänge</h2><table>
      ${lastRuns.map(r => `<tr><td class="muted" style="white-space:nowrap">${esc(r.wochentag)} ${esc(r.zeit_berlin.slice(8, 10))}.${esc(r.zeit_berlin.slice(5, 7))}. ${esc(r.zeit_berlin.slice(11))}</td><td>${esc(r.shop)}</td><td class="num">${r.n} Artikel</td></tr>`).join("")}
    </table></div>
  </div>`;
}

function haltbar() {
  const sold = D.verlauf.filter(r => r.ereignis === "ausverkauft" && r.verfuegbar_stunden)
    .map(r => ({ ...r, h: parseFloat(r.verfuegbar_stunden.replace(",", ".")) })).filter(r => !isNaN(r.h));
  const per = {};
  sold.forEach(r => (per[r.shop] ||= []).push(r.h));
  const rows = Object.entries(per).map(([s, hs]) => ({ s, n: hs.length, med: median(hs), fast: hs.filter(h => h <= 1).length }))
    .sort((a, b) => a.med - b.med);
  const fastest = [...sold].sort((a, b) => a.h - b.h).slice(0, 15);
  return `
  <div class="kpis">
    <div class="kpi"><b>${fmtHours(median(sold.map(r => r.h)))}</b><span>typische Verfügbarkeit (Median)</span></div>
    <div class="kpi"><b>${sold.filter(r => r.h <= 1).length}</b><span>in unter 1 Std. ausverkauft</span></div>
    <div class="kpi"><b>${sold.length}</b><span>gemessene Ausverkäufe</span></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Je Shop <small>wie lange Ware lieferbar bleibt</small></h2><table>
      <tr><th>Shop</th><th class="num">Median</th><th class="num">unter 1 Std.</th><th class="num">Anzahl</th></tr>
      ${rows.map(r => `<tr><td>${esc(r.s)}</td><td class="num">${fmtHours(r.med)}</td><td class="num">${r.fast}</td><td class="num">${r.n}</td></tr>`).join("")}
    </table></div>
    <div class="card"><h2>Am schnellsten weg</h2><table>
      ${fastest.map(r => `<tr><td>${esc(r.artikel)} <span class="muted">${esc(r.packung)}</span></td><td>${esc(r.shop)}</td><td class="num">${fmtHours(r.h)}</td></tr>`).join("")}
    </table></div>
  </div>
  <p class="muted" style="font-size:13px">Gemessen wird zwischen „wieder da“ und „ausverkauft“; bei den schnellen Shops auf 5 Minuten genau, sonst auf 30 Minuten.</p>`;
}

function verlauf() {
  const kind = ui.vkind ?? "zugang", shop = ui.vshop || "", q = normalize(ui.vq || "");
  let rows = D.verlauf.filter(r => (kind === "" || (kind === "zugang" ? ARRIVALS.has(r.ereignis) : r.ereignis === kind))
    && (!shop || r.shop === shop) && (!q || normalize(r.artikel).includes(q)));
  rows = rows.slice(-300).reverse();
  return `<div class="card">
    <div class="tools">
      <input type="search" data-ui="vq" placeholder="Zigarre suchen">
      <select data-ui="vkind"><option value="zugang">Zugänge</option><option value="ausverkauft">Ausverkauft</option><option value="neu_nicht_lieferbar">Neu, nicht lieferbar</option><option value="">Alles</option></select>
      <select data-ui="vshop"><option value="">Alle Shops</option>${byShopName(D.verlauf.map(r => r.shop)).map(s => `<option>${esc(s)}</option>`).join("")}</select>
    </div>
    <div class="scroll"><table>
      <tr><th>Zeit</th><th>Ereignis</th><th>Zigarre</th><th class="num">Preis</th><th>Shop</th></tr>
      ${rows.map(r => { const [t, c] = KIND[r.ereignis] || [r.ereignis, ""];
        return `<tr><td class="muted" style="white-space:nowrap">${esc(r.wochentag)} ${esc(r.zeit_berlin.slice(8, 10))}.${esc(r.zeit_berlin.slice(5, 7))}. ${esc(r.zeit_berlin.slice(11))}</td>
        <td><span class="pill ${c}">${t}</span>${r.ereignis === "ausverkauft" && r.verfuegbar_stunden ? ` <span class="muted">nach ${fmtHours(parseFloat(r.verfuegbar_stunden.replace(",", ".")))}</span>` : ""}</td>
        <td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.artikel)}</a> <span class="muted">${esc(r.packung)}</span></td>
        <td class="num">${esc(r.preis)}</td><td>${esc(r.shop)}</td></tr>`; }).join("") || '<tr><td colspan="5" class="muted">Keine Einträge.</td></tr>'}
    </table></div>
    <p class="muted" style="margin:10px 0 0;font-size:13px">Die letzten ${rows.length} passenden Ereignisse, neueste oben.</p>
  </div>`;
}

function neuheiten() {
  if (!D.neuheiten.length) return '<div class="card muted">Keine Neuheiten-Daten vorhanden.</div>';
  const shop = ui.nshop || "", art = ui.nart || "";
  const arts = [...new Set(D.neuheiten.map(r => r.art))];
  const rows = D.neuheiten.filter(r => (!shop || r.shop === shop) && (!art || r.art === art));
  const recent = [...rows].sort((a, b) => b.zeit_utc.localeCompare(a.zeit_utc)).slice(0, 20);
  return `
  <div class="card"><h2>Wann stellen Shops Neues online? <small>Zeitstempel der Shopsysteme</small></h2>
    <div class="tools">
      <select data-ui="nshop"><option value="">Alle Shops</option>${byShopName(D.neuheiten.map(r => r.shop)).map(s => `<option>${esc(s)}</option>`).join("")}</select>
      ${arts.length > 1 ? `<select data-ui="nart"><option value="">neu + wieder online</option>${arts.map(a => `<option>${esc(a)}</option>`).join("")}</select>` : ""}
    </div>
    ${heatmap(rows.map(r => ({ tag: r.wochentag, stunde: +r.stunde })))}
  </div>
  <div class="card"><h2>Zuletzt online gestellt</h2><table>
    ${recent.map(r => `<tr><td class="muted" style="white-space:nowrap">${esc(r.wochentag)} ${esc(r.zeit_berlin.slice(8, 10))}.${esc(r.zeit_berlin.slice(5, 7))}.${esc(r.zeit_berlin.slice(2, 4))} ${esc(r.zeit_berlin.slice(11))}</td><td>${esc(r.artikel)}</td><td>${esc(r.shop)}</td><td><span class="pill new">${esc(r.art)}</span></td></tr>`).join("")}
  </table></div>`;
}

function shops() {
  const today = new Date().toISOString().slice(0, 10);
  const rows = Object.entries(D.state.shops).filter(([id]) => NAMES[id]).map(([id, st]) => {
    const items = Object.values(st.items || {});
    const lastAlert = [...D.verlauf].reverse().find(r => r.shop === shopName(id) && ARRIVALS.has(r.ereignis));
    return { id, st, n: items.length, av: items.filter(i => i.available).length, lastAlert };
  }).sort((a, b) => (b.st.failures || 0) - (a.st.failures || 0) || shopName(a.id).localeCompare(shopName(b.id), "de"));
  const bad = rows.filter(r => r.st.failures || r.st.last_ok_day !== today).length;
  return `
  <div class="kpis">
    <div class="kpi"><b>${rows.length}</b><span>überwachte Shops</span></div>
    <div class="kpi"><b style="color:var(${bad ? "--bad" : "--ok"})">${bad ? bad : "alle ok"}</b><span>${bad ? "Shops mit Problemen" : "heute fehlerfrei gelesen"}</span></div>
  </div>
  <div class="card scroll"><table>
    <tr><th>Shop</th><th>Zustand</th><th class="num">gelistet</th><th class="num">lieferbar</th><th>letzter Zugang</th></tr>
    ${rows.map(r => `<tr><td>${esc(shopName(r.id))}</td>
      <td>${r.st.failures ? `<span class="pill bad" title="${esc(r.st.last_error)}">${r.st.failures}× Fehler</span> <span class="muted">${esc((r.st.last_error || "").slice(0, 80))}</span>`
        : r.st.last_ok_day === today ? '<span class="pill ok">ok</span>' : `<span class="pill bad">zuletzt ok ${esc(r.st.last_ok_day || "nie")}</span>`}</td>
      <td class="num">${r.n}</td><td class="num">${r.id === "dominique" ? "–" : r.av}</td>
      <td class="muted">${r.lastAlert ? `vor ${ago(r.lastAlert.zeit_utc)}` : "–"}</td></tr>`).join("")}
  </table></div>`;
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab; try { localStorage.setItem("habanos-tab", tab); } catch (err) {}
  render();
});
document.getElementById("reload").addEventListener("click", load);
render(); load();
</script>
</body>
</html>
