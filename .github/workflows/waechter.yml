name: Habanos-Wächter

on:
  schedule:
    # Der Takt (alle 30 Minuten, :00 und :30) kommt von cron-job.org über
    # workflow_dispatch, weil GitHub geplante Läufe nur alle paar Stunden startet.
    # Dieser Zeitplan ist nur die Reserve, falls cron-job.org ausfällt.
    - cron: "11 */3 * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Nur eine Test-Benachrichtigung senden"
        type: boolean
        default: false
      neuheiten:
        description: "Neuheiten-Verzeichnis jetzt aktualisieren (sonst alle 3 Stunden)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # Reserve-Lauf schaut nach, ob der Takt gerade läuft

concurrency:
  # Zeitplan-Läufe (Reserve) bekommen eine eigene Gruppe, damit sie keinen wartenden
  # Takt-Lauf verdrängen. Läuft der Takt, prüft die Reserve keine Shops (siehe unten).
  group: habanos-waechter-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    # Takt-Läufe prüfen nach dem vollen Durchgang die schnellen Shops alle 5 Minuten
    # bis kurz vor der nächsten halben Stunde, deshalb bis zu ca. 28 Minuten.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Test-Benachrichtigung
        if: ${{ inputs.test_push }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python waechter.py --test-push

      - name: Läuft der Takt gerade?
        # Der Reserve-Lauf (oft von GitHub verspätet gestartet) soll nicht gleichzeitig mit
        # einem Takt-Lauf denselben Bestand prüfen: Das gab doppelte Push-Nachrichten und
        # überschriebene Zeilen in verlauf.csv. Läuft der Takt oder lief er vor <40 Minuten,
        # macht die Reserve nur die Neuheiten.
        id: takt
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grenze=$(date -u -d '40 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          aktiv=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow waechter.yml \
                    --event workflow_dispatch --limit 5 --json status,createdAt \
                    -q "[.[] | select(.status != \"completed\" or .createdAt > \"$grenze\")] | length" \
                  || echo 0)
          echo "Takt-Läufe aktiv oder seit $grenze gestartet: $aktiv"
          if [ "$aktiv" -gt 0 ]; then echo "aktiv=true" >> "$GITHUB_OUTPUT"; fi

      - name: Shops prüfen
        if: ${{ !inputs.test_push && steps.takt.outputs.aktiv != 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python waechter.py ${{ github.event_name == 'workflow_dispatch' && '--nachpruefen' || '' }}

      - name: Neuheiten aktualisieren
        # alle 3 Stunden über den GitHub-Zeitplan oder auf Wunsch; Fehler stoppen den Lauf nicht
        if: ${{ !inputs.test_push && (github.event_name == 'schedule' || inputs.neuheiten) }}
        continue-on-error: true
        run: python neuheiten.py

      - name: Auswertung aktualisieren
        if: ${{ !inputs.test_push }}
        run: python auswertung.py -o auswertung.md

      - name: Bestand speichern
        if: ${{ !inputs.test_push }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json auswertung.md
          if [ -f verlauf.csv ]; then git add verlauf.csv; fi
          if [ -f neuheiten.csv ]; then git add neuheiten.csv; fi
          if git diff --cached --quiet; then
            echo "Keine Änderungen am Bestand."
          else
            git commit -m "Bestand aktualisiert"
            # Hat ein anderer Lauf inzwischen gespeichert, erst dessen Stand holen.
            # Bei Konflikten gewinnt dieser (neuere) Lauf.
            for versuch in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push abgelehnt (Versuch $versuch), hole neuen Stand ..."
              git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
              sleep $((versuch * 5))
            done
            exit 1
          fi
